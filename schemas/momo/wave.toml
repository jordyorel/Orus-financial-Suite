[meta]
id          = "wave"
version     = "1.0"
auth_type   = "api_key_hmac"
mti_debit   = "0200"
mti_credit  = "0200"

[endpoints]
transfer    = "POST /v1/transfer"
callback    = "POST /webhooks/wave"

[[field_mappings]]
json_path   = "msisdn"
im_field    = "pan"
transform   = "msisdn_to_pan"

[[field_mappings]]
json_path   = "amount"
im_field    = "amount"
transform   = "to_centimes"

[[field_mappings]]
json_path   = "currency"
im_field    = "currency"
